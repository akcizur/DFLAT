name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Check Blender generator Python syntax
        run: python -m py_compile tools/generate_socialist_block_17.py
      - name: Check JavaScript syntax
        run: bun run check:syntax
      - name: Run geometry and navigation regression tests
        run: bun run test
      - name: Check project architecture
        run: bun run check
      - name: Build production site
        run: bun run build
      - name: Install Playwright browser test runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify rendered 3D scene in Chromium
        run: node scripts/smoke-browser.mjs
