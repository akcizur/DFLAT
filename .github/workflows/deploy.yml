name: Deploy DFLAT to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate geometry and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Check Blender generator Python syntax
        run: python -m py_compile tools/generate_socialist_block_17.py tools/generate_t06b_panelak_v2.py
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Generate the active T06B V2 model and geometry manifest
        run: blender --background --python tools/generate_t06b_panelak_v2.py
      - name: Check JavaScript syntax
        run: bun run check:syntax
      - name: Check repository architecture
        run: bun run check
      - name: Test building geometry invariants
        run: bun run test
      - name: Verify production build
        run: bun run build
      - name: Upload validated static site
        uses: actions/upload-artifact@v4
        with:
          name: validated-dflat-site
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy validated build to GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the exact validated site artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-dflat-site
          path: dist/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
